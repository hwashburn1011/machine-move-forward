<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Move Forward</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0705;
        height: 100%;
      }
      canvas#game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0705;
        color: #d8a05a;
        font: 500 13px/1.6 ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="boot">Spinning up the machine…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
