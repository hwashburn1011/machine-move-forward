<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine Move Forward</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0705;
        height: 100%;
      }
      canvas#game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0705;
        color: #d8a05a;
        font: 500 13px/1.6 ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <!--
      A SIBLING of #hud, not a child: `HUD` owns #hud's innerHTML and would
      wipe anything appended to it. Styled in hud.css alongside the HUD, so
      the menu and the HUD share one palette.
    -->
    <div id="title"></div>
    <div id="boot">Spinning up the machine…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
